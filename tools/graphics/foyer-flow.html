  </g>

  <!-- the dominant path: a swept band with a dashed centreline -->
  <path d="M180 660 L180 340 L1000 340" fill="none" stroke="#efeeea" stroke-width="44" stroke-linejoin="round"/>

  <text x="150" y="596" font-size="12" class="mo-fine" transform="rotate(-90 150 596)">dominant path</text>

  <path class="wall" d="M230 640 H1140 V40 H60 V640 H130"/>
  <path class="line" d="M130 640 A100 100 0 0 1 230 540"/>

  <!-- the host -->
  <g id="ff-host" data-tip="The foyer host stands where the path splits: greets, helps a first order at the kiosk, and directs cash and specific-piece requests to the counter. Rostered at peak, reporting to the restaurant manager.">

    <circle class="a-crew mo-hit" cx="212" cy="318" r="9"/>

<div class="mo-bar">
  <button type="button" data-play aria-pressed="false">Play</button>
  <button type="button" data-toggle="host" aria-pressed="true">Host on shift</button>
  <span class="mo-key"><i class="person"></i> guest &nbsp; <i class="cash"></i> cash guest &nbsp; <i class="crew"></i> host</span>
</div>
<figcaption id="g-foyer-flow-cap"><span class="fignum">Plan</span>The foyer, drawn from the placement standard: kiosks in a bank on the dominant path, the host where the path splits, the counter as an equal path with the stealth register, and the collection point apart from the queue. The figures walk the paths the standard designs for; they are not a measured flow. A rose ring marks a cash guest. Switch the host off to see the split with nobody standing on it. Hover or tab to a zone for its rule.</figcaption>
<script>
(function () {
  var M = window.Motion; if (!M) return;
  var root = document.getElementById('g-foyer-flow');
  var svg = root.querySelector('svg');
  var agents = document.getElementById('ff-agents'), marks = document.getElementById('ff-marks');
  var halo = document.getElementById('ff-host-halo'), hostLabel = document.getElementById('ff-host-label'), host = document.getElementById('ff-host');
  var SPAWN = 2.1, LOOP = 84, WALK = 95;            /* seconds between guests, seconds a loop, units a second */
  var CORNER = [180, 340];
  var KIOSK = [[214, 403], [214, 483], [214, 563]];
  var COUNTER = [[700, 260], [780, 250], [860, 262], [940, 255]];
  var COLLECT = [[1046, 306], [1046, 328]];
  var TABLES = [[760, 500], [830, 560], [910, 490], [990, 570], [1060, 510], [880, 600]];
  var CHAIR = [[0, -24], [24, 0], [0, 24], [-24, 0]];

  /* A guest's whole journey is a pure function of its index and the host state,
     so any frame can be drawn on its own and a frozen frame is reproducible. */
  function journey(i, s) {
    var r = M.rng(1000 + i * 7919);
    var cash = r() < 0.22;
    var pts = [[150, 690], [180, 640], [180, 600]];
    var dwell = [0, 0, 0];
    function go(p, d) { pts.push(p); dwell.push(d || 0); }
    var k = i % 3, q = i % COUNTER.length, tb = TABLES[i % TABLES.length], ch = CHAIR[Math.floor(i / TABLES.length) % 4], seat = [tb[0] + ch[0], tb[1] + ch[1]];
    var hesitate = 0, toCounter = cash;
    if (!s.host) {
      hesitate = 1.4 + r() * 2.2;
      if (!cash && r() < 0.5) toCounter = true;
    }
    if (toCounter) {
      go([180, 360], hesitate);                            /* the split, and the pause without a host */
      go(CORNER, s.host ? 0.6 : 0);                         /* a word with the host */
      go([COUNTER[q][0] - 40, 340], 0); go(COUNTER[q], 4.5 + r() * 2);
      go([COUNTER[q][0], 340], 0); go([1000, 340], 0); go(COLLECT[i % 2], 2.5 + r());
    } else {
      if (!s.host) { go([180, 360], hesitate); go([180, 380], 0); }
      go([180, KIOSK[k][1]], 0); go(KIOSK[k], 5 + r() * 3);   /* order at the kiosk */
      go([180, KIOSK[k][1]], 0); go(CORNER, s.host ? 0.4 : 0);
      go([1000, 340], 0); go(COLLECT[i % 2], 2.5 + r());
    }
    go([1000, 420], 0); go(seat, 9 + r() * 4);
    /* times at each waypoint */
    var times = [0]; var T = 0;
    for (var j = 1; j < pts.length; j++) {
      var d = Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]);
      T += d / WALK; times.push(T); T += dwell[j]; times.push(T);
    }
    return { cash: cash, pts: pts, times: times, end: T, hesitate: hesitate, toCounter: toCounter };
  }
  function at(J, u) {
    /* times alternate arrive, leave for each waypoint after the first */
    if (u >= J.end) return null;
    var idx = 1, k = 1;
    while (idx < J.pts.length) {
      var arrive = J.times[k], leave = J.times[k + 1];
      if (u < arrive) {
        var t0 = idx === 1 ? 0 : J.times[k - 1];
        var f = (u - t0) / (arrive - t0), a = J.pts[idx - 1], b = J.pts[idx];
        return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, waiting: false, idx: idx };
      }
      if (u <= leave) return { x: J.pts[idx][0], y: J.pts[idx][1], waiting: true, idx: idx };
      idx += 1; k += 2;
    }
    return null;
  }
  var pool = [];
  function circle(kind) {
    var g = M.el('g', {}, agents);
    var ghosts = [M.el('circle', { r: 5, 'class': 'ff-ghost ' + (kind === 'cash' ? 'ring-person' : 'a-person'), opacity: 0.16 }, g),
                  M.el('circle', { r: 6, 'class': 'ff-ghost ' + (kind === 'cash' ? 'ring-person' : 'a-person'), opacity: 0.32 }, g)];
    var c = M.el('circle', { r: 7, 'class': kind === 'cash' ? 'ring-person' : 'a-person', 'stroke-width': kind === 'cash' ? 3 : 0 }, g);
    var q = M.text(g, 0, 0, '?', { 'font-size': 14, 'font-weight': 700, 'text-anchor': 'middle', 'class': 'a-attention' }); q.setAttribute('opacity', 0);
    var ring = M.el('circle', { r: 12, 'class': 'ring-attention', 'stroke-width': 1.5, opacity: 0 }, g);
    return { g: g, c: c, q: q, ring: ring, ghosts: ghosts };
  }
  var N = Math.ceil(LOOP / SPAWN) + 8;
  for (var i = 0; i < N; i++) pool.push(null);

  function draw(t, s) {
    halo.setAttribute('opacity', s.host ? 1 : 0);
    host.querySelector('.a-crew').setAttribute('opacity', s.host ? 1 : 0.18);
    hostLabel.textContent = s.host ? 'Foyer host' : 'Nobody at the split';
    for (var i = 0; i < N; i++) {
      var spawn = i * SPAWN - 40;                  /* the scene is already busy at t = 0 */
      var J = journey(i, s), u = t - spawn;
      if (u < 0 && t + LOOP - spawn < J.end) u = t + LOOP - spawn;   /* wrap the loop */
      var p = u >= 0 ? at(J, u) : null;
      if (!p) { if (pool[i]) { pool[i].g.setAttribute('opacity', 0); } continue; }
      if (!pool[i]) pool[i] = circle(J.cash ? 'cash' : 'person');
      var a = pool[i];
      a.g.setAttribute('opacity', 1);
      a.g.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')');
      /* a short trail behind a moving figure, so a still frame shows direction */
      for (var k2 = 0; k2 < 2; k2++) {
        var pp = p.waiting ? null : at(J, u - 0.55 + k2 * 0.25);
        if (pp) { a.ghosts[k2].setAttribute('cx', pp.x - p.x); a.ghosts[k2].setAttribute('cy', pp.y - p.y); a.ghosts[k2].setAttribute('opacity', 0.16 + k2 * 0.16); }
        else a.ghosts[k2].setAttribute('opacity', 0);
      }
      var hes = !s.host && p.waiting && p.idx === 3 && J.hesitate > 0;
      a.q.setAttribute('opacity', hes ? 1 : 0); a.q.setAttribute('y', -22);
      a.ring.setAttribute('opacity', hes ? 0.9 : 0);
    }
  }
  function describe(s) {
    return s.host ? 'Host on shift: guests are greeted at the split, card guests go to the kiosks, cash guests to the counter.'
                  : 'No host: guests pause at the split, about half turn to the counter and the queue grows.';
  }
  M.mount(root, { duration: LOOP, freeze: parseFloat(root.getAttribute('data-freeze')) || 41, state: { host: true }, draw: draw, describe: describe });
})();
</script>
</figure>
