<svg xmlns="http://www.w3.org/2000/svg" width="960" height="287" viewBox="0 0 960 287" role="img" aria-label="What the top ten became"><rect width="960" height="287" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">What the top ten became</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">The ten scored priorities, placed on the release that carried them. Eight had a named release across November 2024 and 2025, and ten</text><text x="28.0" y="86.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">further releases followed in early 2026.</text><text x="28.0" y="121.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Release 1.63, November 2024</text><rect x="218" y="108" width="200.4" height="16" rx="2" fill="#4a6b4f"/><text x="426.4" y="121.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">3</text><text x="28.0" y="151.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Release 1.64, 2025</text><rect x="218" y="138" width="334.0" height="16" rx="2" fill="#cfcec7"/><text x="560.0" y="151.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">5</text><text x="28.0" y="181.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Scheduled, release to be confirmed</text><rect x="218" y="168" width="133.6" height="16" rx="2" fill="#cfcec7"/><text x="359.6" y="181.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">2</text><text x="28.0" y="218.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">The first two out were the five-hour break warning and the supervisor break hard stop, ranked one and two. Both were compliance items the old</text><text x="28.0" y="235.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">warnings list had buried.</text><text x="28.0" y="254.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Top ten prioritisation and release plan, Time and Attendance Findings Report, October 2024.</text></svg>