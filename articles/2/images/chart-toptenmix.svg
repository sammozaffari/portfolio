<svg xmlns="http://www.w3.org/2000/svg" width="960" height="267" viewBox="0 0 960 267" role="img" aria-label="The top ten by what it was and when it landed"><rect width="960" height="267" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">The top ten by what it was and when it landed</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">The ten scored priorities, cross-tabulated by the category each carried and the release that eventually took it.</text><text x="387.0" y="90.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="middle">Release 1.63, Nov 2024</text><text x="605.0" y="90.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="middle">Release 1.64, 2025</text><text x="823.0" y="90.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69" text-anchor="middle">Scheduled</text><text x="28.0" y="127.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Compliance</text><rect x="280.0" y="110" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.68"/><text x="387.0" y="127.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><rect x="498.0" y="110" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.88"/><text x="605.0" y="127.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><rect x="716.0" y="110" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.30"/><text x="823.0" y="127.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">1</text><text x="28.0" y="161.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Experience</text><rect x="280.0" y="144" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.10"/><text x="387.0" y="161.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">0</text><rect x="498.0" y="144" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.30"/><text x="605.0" y="161.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">1</text><rect x="716.0" y="144" width="214.0" height="26" rx="3" fill="#3f5a7a" fill-opacity="0.30"/><text x="823.0" y="161.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#111110" text-anchor="middle">1</text><text x="28.0" y="198.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Eight of the ten were compliance items. That is the shape of the finding: the platform was not short of features, it was short of a compliance</text><text x="28.0" y="215.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">layer people could actually work inside.</text><text x="28.0" y="234.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Top ten prioritisation and release plan, Time and Attendance Findings Report, October 2024.</text></svg>