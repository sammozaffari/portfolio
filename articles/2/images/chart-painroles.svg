<svg xmlns="http://www.w3.org/2000/svg" width="960" height="389" viewBox="0 0 960 389" role="img" aria-label="Who felt the pain points"><rect width="960" height="389" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Who felt the pain points</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Pain points recorded against the role that raised them, across restaurant, area and above-restaurant participants.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Area coach</text><rect x="218" y="90" width="300.6" height="16" rx="2" fill="#3f5a7a"/><text x="526.6" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">45</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Rostering manager</text><rect x="218" y="120" width="280.6" height="16" rx="2" fill="#3f5a7a"/><text x="506.6" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">42</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Restaurant general manager</text><rect x="218" y="150" width="233.8" height="16" rx="2" fill="#cfcec7"/><text x="459.8" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">35</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Team member</text><rect x="218" y="180" width="167.0" height="16" rx="2" fill="#cfcec7"/><text x="393.0" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">25</text><text x="28.0" y="223.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Payroll</text><rect x="218" y="210" width="73.5" height="16" rx="2" fill="#cfcec7"/><text x="299.5" y="223.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">11</text><text x="28.0" y="253.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Support</text><rect x="218" y="240" width="66.8" height="16" rx="2" fill="#cfcec7"/><text x="292.8" y="253.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">10</text><text x="28.0" y="283.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Central teams</text><rect x="218" y="270" width="60.1" height="16" rx="2" fill="#cfcec7"/><text x="286.1" y="283.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">9</text><text x="28.0" y="320.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">The two heaviest roles are the ones who build the roster and the one who has to answer for it across a dozen restaurants. Neither was the role</text><text x="28.0" y="337.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">the platform was designed around.</text><text x="28.0" y="356.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Pain point register, Time and Attendance Findings Report, October 2024.</text></svg>