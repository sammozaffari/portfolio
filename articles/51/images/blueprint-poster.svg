<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="672" viewBox="0 0 1100 672" role="img" aria-label="Service quality: the guest journey with its measures"><rect width="1100" height="672" fill="#fff"/><text x="20" y="46" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111110">Service quality: the guest journey with its measures</text><text x="20" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">Five stages from order entry to post-visit feedback across the guest, the backstage systems and the</text><text x="20" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e69">measures. The failure points are the complaint clusters the decomposition located.</text><rect x="170.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="180.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">1 Order entry</text><rect x="352.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="362.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">2 Payment</text><rect x="534.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="544.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">3 Production and pack</text><rect x="716.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="726.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">4 Handoff</text><rect x="898.0" y="110" width="182.0" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="908.0" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111110">5 Post-visit feedback</text><rect x="20" y="110" width="150" height="40" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e69">Stage</text><rect x="20" y="150" width="150" height="130" fill="#ffffff" stroke="#bdbdb7"/><text x="30" y="172" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Guest</text><text x="30" y="188" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">(frontstage)</text><rect x="170.0" y="150" width="182.0" height="130" fill="#ffffff" stroke="#bdbdb7"/><text x="180.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Counter, kiosk, app or</text><text x="180.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">drive-thru</text><text x="180.0" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Order entry across four</text><text x="180.0" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">channels; kiosk friction</text><text x="180.0" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">is the leading entry</text><text x="180.0" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">complaint.</text><rect x="352.0" y="150" width="182.0" height="130" fill="#ffffff" stroke="#bdbdb7"/><text x="362.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Acknowledged at the</text><text x="362.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">till</text><text x="362.0" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">A verbal acknowledgment</text><text x="362.0" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">standard: no silent queue</text><text x="362.0" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">at a busy till.</text><rect x="534.0" y="150" width="182.0" height="130" fill="#ffffff" stroke="#bdbdb7"/><text x="544.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order built, packed,</text><text x="544.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">handed over</text><text x="544.0" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Accuracy is the largest</text><text x="544.0" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">complaint cluster:</text><text x="544.0" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">missing items and refund</text><text x="544.0" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">friction.</text><rect x="716.0" y="150" width="182.0" height="130" fill="#ffffff" stroke="#bdbdb7"/><text x="726.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Counter, window or</text><text x="726.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">delivery pickup</text><text x="726.0" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Long waits and</text><text x="726.0" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">understaffing dominate at</text><text x="726.0" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">drive-thru and delivery</text><text x="726.0" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">handoff.</text><rect x="898.0" y="150" width="182.0" height="130" fill="#ffffff" stroke="#bdbdb7"/><text x="908.0" y="170" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Invited to give</text><text x="908.0" y="187" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">feedback</text><text x="908.0" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Most comments arrive</text><text x="908.0" y="219" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">without channel</text><text x="908.0" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">attribution: the named</text><text x="908.0" y="249" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">data gap.</text><line x1="20" y1="280" x2="1080" y2="280" stroke="#111110" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1076" y="276" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a46">Line of visibility</text><rect x="20" y="280" width="150" height="130" fill="#fbfaf6" stroke="#bdbdb7"/><text x="30" y="302" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Backstage systems</text><rect x="170.0" y="280" width="182.0" height="130" fill="#fbfaf6" stroke="#bdbdb7"/><text x="180.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Kiosk routing rules</text><text x="180.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Self-service suggested to</text><text x="180.0" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">card payers without</text><text x="180.0" y="347" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">special discounts;</text><text x="180.0" y="362" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">counter first for cash,</text><text x="180.0" y="377" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">seniors and staff.</text><rect x="352.0" y="280" width="182.0" height="130" fill="#fbfaf6" stroke="#bdbdb7"/><text x="362.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Station scripting</text><text x="362.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Acknowledgment and</text><text x="362.0" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">recovery lines per</text><text x="362.0" y="347" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">station; queue</text><text x="362.0" y="362" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">abandonment intercepted.</text><rect x="534.0" y="280" width="182.0" height="130" fill="#fbfaf6" stroke="#bdbdb7"/><text x="544.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Pack-check at handoff</text><text x="544.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Visual checklists at</text><text x="544.0" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">drive-thru and delivery</text><text x="544.0" y="347" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">pickup; a fast refund and</text><text x="544.0" y="362" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">remake script.</text><rect x="716.0" y="280" width="182.0" height="130" fill="#fbfaf6" stroke="#bdbdb7"/><text x="726.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Peak labour planning</text><text x="726.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Labour-plan review at</text><text x="726.0" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">drive-thru-heavy sites; a</text><text x="726.0" y="347" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">parked-car waiting board</text><text x="726.0" y="362" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">makes the wait explicit.</text><rect x="898.0" y="280" width="182.0" height="130" fill="#fbfaf6" stroke="#bdbdb7"/><text x="908.0" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Attribution and</text><text x="908.0" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">verified rules</text><text x="908.0" y="334" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Coding rules shrink the</text><text x="908.0" y="349" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">unattributed pool;</text><text x="908.0" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">measurement uses verified</text><text x="908.0" y="379" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">feedback only.</text><rect x="20" y="410" width="150" height="115" fill="#f4f3ee" stroke="#bdbdb7"/><text x="30" y="432" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111110">Measures</text><rect x="170.0" y="410" width="182.0" height="115" fill="#f4f3ee" stroke="#bdbdb7"/><text x="180.0" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Kiosk-friction theme</text><text x="180.0" y="447" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">share</text><text x="180.0" y="464" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Order-entry complaints</text><text x="180.0" y="479" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">tracked weekly by</text><text x="180.0" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">cluster.</text><rect x="352.0" y="410" width="182.0" height="115" fill="#f4f3ee" stroke="#bdbdb7"/><text x="362.0" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Acknowledgment</text><text x="362.0" y="447" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">adherence</text><text x="362.0" y="464" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Capability checks on the</text><text x="362.0" y="479" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">digital observation form;</text><text x="362.0" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">script adherence scored.</text><rect x="534.0" y="410" width="182.0" height="115" fill="#f4f3ee" stroke="#bdbdb7"/><text x="544.0" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Order accuracy</text><text x="544.0" y="447" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Pack-check completion</text><text x="544.0" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">plus the accuracy-theme</text><text x="544.0" y="477" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">trend.</text><rect x="716.0" y="410" width="182.0" height="115" fill="#f4f3ee" stroke="#bdbdb7"/><text x="726.0" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Wait-theme trend</text><text x="726.0" y="447" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Weekly rank against the</text><text x="726.0" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">prior week, flagged to</text><text x="726.0" y="477" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">area leaders.</text><rect x="898.0" y="410" width="182.0" height="115" fill="#f4f3ee" stroke="#bdbdb7"/><text x="908.0" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">Channel-attribution</text><text x="908.0" y="447" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111110">rate</text><text x="908.0" y="464" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The unattributed share</text><text x="908.0" y="479" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">reported as a named gap,</text><text x="908.0" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">never dropped.</text><rect x="20" y="525" width="150" height="117" fill="#fdf3f2" stroke="#bdbdb7"/><text x="30" y="547" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b3261e">Failure points</text><rect x="170.0" y="525" width="182.0" height="117" fill="#fdf3f2" stroke="#bdbdb7"/><text x="180.0" y="545" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-01 Kiosk friction;</text><text x="180.0" y="562" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">combo items counter-</text><text x="180.0" y="579" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">only</text><text x="180.0" y="596" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Bulk items missing from</text><text x="180.0" y="611" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">the kiosk menu.</text><rect x="352.0" y="525" width="182.0" height="117" fill="#fdf3f2" stroke="#bdbdb7"/><text x="362.0" y="545" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-02 No acknowledgment;</text><text x="362.0" y="562" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">queue abandonment</text><text x="362.0" y="579" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Invisible abandonment at</text><text x="362.0" y="594" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">the till.</text><rect x="534.0" y="525" width="182.0" height="117" fill="#fdf3f2" stroke="#bdbdb7"/><text x="544.0" y="545" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-03 Missing items;</text><text x="544.0" y="562" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">refund friction</text><text x="544.0" y="579" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">The accuracy pillar</text><text x="544.0" y="594" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">exists because of this.</text><rect x="716.0" y="525" width="182.0" height="117" fill="#fdf3f2" stroke="#bdbdb7"/><text x="726.0" y="545" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-04 Long waits;</text><text x="726.0" y="562" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">understaffing</text><text x="726.0" y="579" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Peak labour review is the</text><text x="726.0" y="594" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">primary intervention.</text><rect x="898.0" y="525" width="182.0" height="117" fill="#fdf3f2" stroke="#bdbdb7"/><text x="908.0" y="545" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">F-05 No channel</text><text x="908.0" y="562" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b3261e">attribution</text><text x="908.0" y="579" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">Named rather than</text><text x="908.0" y="594" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a4a46">dropped.</text><text x="20" y="662" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e69">KFC South Pacific franchisee group, 2025. Drawn by Sam Mozaffari from the engagement's journey map; vendors, sites and people removed. Rendered September 2026.</text></svg>