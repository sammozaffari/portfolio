<svg xmlns="http://www.w3.org/2000/svg" width="960" height="329" viewBox="0 0 960 329" role="img" aria-label="What kind of fix each pain point needed"><rect width="960" height="329" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">What kind of fix each pain point needed</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">Every one of the 175 pain points was tagged by the kind of change that would resolve it, before anything was ranked.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Technology</text><rect x="218" y="90" width="273.9" height="16" rx="2" fill="#cfcec7"/><text x="499.9" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">41%</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Education</text><rect x="218" y="120" width="173.7" height="16" rx="2" fill="#9b3427"/><text x="399.7" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">26%</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Integration</text><rect x="218" y="150" width="140.3" height="16" rx="2" fill="#cfcec7"/><text x="366.3" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">21%</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Process change</text><rect x="218" y="180" width="73.5" height="16" rx="2" fill="#cfcec7"/><text x="299.5" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">11%</text><text x="28.0" y="223.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Other</text><rect x="218" y="210" width="6.7" height="16" rx="2" fill="#cfcec7"/><text x="232.7" y="223.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">1%</text><text x="28.0" y="260.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Only 41 per cent were a software problem. A quarter were education, and the business had no channel to deliver it through, which is the gap the</text><text x="28.0" y="277.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">blueprint named.</text><text x="28.0" y="296.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Pain point triage, Time and Attendance Findings Report, October 2024.</text></svg>