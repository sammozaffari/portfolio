<svg xmlns="http://www.w3.org/2000/svg" width="960" height="299" viewBox="0 0 960 299" role="img" aria-label="Who answered the field survey"><rect width="960" height="299" fill="#ffffff"/><text x="28.0" y="46.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111110">Who answered the field survey</text><text x="28.0" y="68.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6e6e69">200 responses from across the restaurant network, gated by role at the first question.</text><text x="28.0" y="103.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#111110">Team member</text><rect x="218" y="90" width="447.6" height="16" rx="2" fill="#a8781c"/><text x="673.6" y="103.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">67%</text><text x="28.0" y="133.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Assistant restaurant manager</text><rect x="218" y="120" width="133.6" height="16" rx="2" fill="#cfcec7"/><text x="359.6" y="133.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">20%</text><text x="28.0" y="163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Shift supervisor</text><rect x="218" y="150" width="80.2" height="16" rx="2" fill="#cfcec7"/><text x="306.2" y="163.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">12%</text><text x="28.0" y="193.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3f3f3b">Restaurant general manager</text><rect x="218" y="180" width="6.7" height="16" rx="2" fill="#cfcec7"/><text x="232.7" y="193.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="600" fill="#3f3f3b">1%</text><text x="28.0" y="230.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">Two thirds were team members, the group the platform gave the least back to. Area coaches and franchisees returned nothing, so those roles were</text><text x="28.0" y="247.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#3f3f3b">covered by interview instead.</text><text x="28.0" y="266.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#6e6e69">Field survey, 200 responses, Time and Attendance Findings Report, October 2024.</text></svg>