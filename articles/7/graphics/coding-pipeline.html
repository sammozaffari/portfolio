<figcaption id="g-coding-pipeline-cap"><span class="fignum">Method</span>How a guest comment was coded: a theme, a sentiment and a confidence score, a human review queue for anything the coding was unsure of, then the decomposition into speed, execution or both. The cross-mention test underneath is the asymmetry that put execution under most speed complaints. Hover or tab to a stage, a bin or the test.</figcaption>
<script>
(function () {
  var M = window.Motion; if (!M) return;
  var root = document.getElementById('g-coding-pipeline');
  var cardsG = document.getElementById('cp-cards'), pillsG = document.getElementById('cp-bin-pills');
  var THEMES = { miss: 'Missing or wrong items', refund: 'Refund friction', kiosk: 'Kiosk friction', wait: 'Waits and understaffing', ack: 'No acknowledgment at the till', tone: 'Demeanour' };
  /* ten written comments; each resolves to one bin, and one is sent to a person first */
  /* text, theme, sentiment, confidence, bin, the label it carries into the bin, sent to a person */
  var COMMENTS = [
    ['Waited twelve minutes, then the burger was missing.', 'miss', 'complaint', 0.92, 'both', 'Long wait, missing item'],
    ['Nobody looked up when I got to the counter.', 'ack', 'complaint', 0.88, 'exec', 'Not acknowledged at the till'],
    ['The kiosk would not let me add a bulk box.', 'kiosk', 'complaint', 0.81, 'exec', 'Kiosk menu gap'],
    ['Quick, hot, and the person at the window was lovely.', 'tone', 'praise', 0.90, 'praise', 'Named the crew member'],
    ['Drive-thru line took forever tonight.', 'wait', 'complaint', 0.84, 'speed', 'Drive-thru queue'],
    ['No pickles, got pickles, then queued again for a refund.', 'refund', 'complaint', 0.90, 'both', 'Wrong item, then a refund queue'],
    ['Took a while but fine I suppose.', 'wait', 'complaint', 0.41, 'speed', 'Ambiguous wait', true],
    ['Chips were cold and the order number never came up.', 'miss', 'complaint', 0.70, 'exec', 'Cold item, no call-out'],
    ['Queue out the door and one till open.', 'wait', 'complaint', 0.86, 'speed', 'One till at peak'],
    ['Staff were rushing and forgot my sauces.', 'miss', 'complaint', 0.77, 'both', 'Rushed, item forgotten']
  ];
  var BIN_Y = { speed: 196, both: 318, exec: 440, praise: 562 };
  var X = { start: 28, theme: 320, sent: 516, conf: 712 };
  var BELT_Y = 250, W = 196, H = 56, EVERY = 4.2, LOOP = 50, SPEED = 132;
  /* each comment has a fixed pill slot in its bin, so nothing moves once it lands */
  var slot = {}, used = {};
  COMMENTS.forEach(function (c, i) { var b = c[4]; slot[i] = used[b] = (used[b] || 0); used[b] += 1; });
  var pills = COMMENTS.map(function (c, i) {
    var y = BIN_Y[c[4]] + 32 + slot[i] * 24;
    var g = M.el('g', { 'class': 'cp-pill', opacity: 0 }, pillsG);
    M.el('rect', { x: 892, y: y, width: 216, height: 20, rx: 3 }, g);
    M.text(g, 900, y + 14, c[5], { 'font-size': 11 });
    if (c[6]) M.el('circle', { cx: 1098, cy: y + 10, r: 4, 'class': 'a-crew' }, g);
    return { g: g, x: 1000, y: y + 10 };
  });
  function card(i) {
    var c = COMMENTS[i % COMMENTS.length];
    var g = M.el('g', { 'class': 'cp-card' + (c[3] < 0.6 ? ' low' : '') }, cardsG);
    M.el('rect', { x: 0, y: 0, width: W, height: H, rx: 4 }, g);
    var words = c[0].split(' '), l1 = '', l2 = '';
    words.forEach(function (w) { if (!l2 && (l1 + ' ' + w).trim().length <= 31) l1 = (l1 + ' ' + w).trim(); else l2 = (l2 + ' ' + w).trim(); });
    M.text(g, 9, 18, l1, { 'font-size': 11, 'class': 'mo-fine' }); M.text(g, 9, 32, l2, { 'font-size': 11, 'class': 'mo-fine' });
    var chip = M.el('g', { 'class': 'cp-chip', opacity: 0 }, g);
    var label = THEMES[c[1]], cw = Math.min(150, label.length * 5.6 + 12);
    M.el('rect', { x: 9, y: 38, width: cw, height: 14, rx: 2 }, chip); M.text(chip, 14, 48.5, label, { 'font-size': 10 });
    var sent = M.text(g, W - 9, 48.5, c[2], { 'class': 'cp-sent', 'font-size': 10, 'text-anchor': 'end', opacity: 0 });
    var conf = M.el('rect', { x: 9, y: H - 3.5, width: 0, height: 3, rx: 1.5, 'class': 'cp-conf-fill' }, g);
    var stamp = M.el('circle', { cx: W - 11, cy: 11, r: 5, 'class': 'a-crew', opacity: 0 }, g);
    return { g: g, c: c, chip: chip, sent: sent, conf: conf, stamp: stamp };
  }
  var pool = [], N = Math.ceil(LOOP / EVERY) + 6;
  function where(i, u) {
    var c = COMMENTS[i % COMMENTS.length], review = !!c[6];
    var legs = [[X.theme, 1.5], [X.sent, 1.3], [X.conf, 1.7]];
    var t = 0, x = X.start;
    for (var k = 0; k < legs.length; k++) {
      var move = (legs[k][0] - x) / SPEED;
      if (u < t + move) return { x: x + (legs[k][0] - x) * ((u - t) / move), y: BELT_Y, stage: k };
      t += move; x = legs[k][0];
      if (u < t + legs[k][1]) return { x: x, y: BELT_Y, stage: k + 1, dwell: (u - t) / legs[k][1] };
      t += legs[k][1];
    }
    if (review) {
      var down = 1.0, hold = 2.8;
      if (u < t + down) return { x: X.conf, y: BELT_Y + (406 - BELT_Y) * M.ease((u - t) / down), stage: 3 };
      t += down;
      if (u < t + hold) return { x: X.conf, y: 406, stage: 'review', dwell: (u - t) / hold };
      t += hold;
      if (u < t + down) return { x: X.conf, y: 406 - (406 - BELT_Y) * M.ease((u - t) / down), stage: 'reviewed' };
      t += down;
    }
    /* the card runs to the end of the belt and dissolves; its pill fades up in the bin,
       so nothing is ever drawn across a bin or across the review lane */
    var p = pills[i % COMMENTS.length], glide = 1.8, END = 846;
    if (u < t + glide) {
      var f = (u - t) / glide;
      return { x: X.conf + (END - X.conf) * Math.min(1, f / 0.5), y: BELT_Y, stage: 'bin', f: f };
    }
    return { x: p.x, y: p.y, stage: 'binned', until: t + glide + 30 };
  }
  function draw(t) {
    var shown = {};
    for (var i = 0; i < N; i++) {
      var idx = i % COMMENTS.length, spawn = i * EVERY - 18, u = t - spawn;
      if (u < 0 && t + LOOP - spawn >= 0) u = t + LOOP - spawn;
      var p = u >= 0 ? where(i, u) : null;
      if (p && p.until && u > p.until) p = null;
      if (!p) { if (pool[i]) pool[i].g.setAttribute('opacity', 0); continue; }
      if (!pool[i]) pool[i] = card(i);
      var k = pool[i], c = k.c;
      if (p.stage === 'binned') { k.g.setAttribute('opacity', 0); shown[idx] = 1; continue; }
      if (p.stage === 'bin' && p.f >= 0.5) k.g.setAttribute('opacity', 0);
      var fade = p.stage === 'bin' ? Math.max(0, 1 - p.f / 0.5) : 1, scale = p.stage === 'bin' ? 1 - 0.3 * Math.min(1, p.f / 0.5) : 1;
      if (p.stage === 'bin') shown[idx] = Math.max(shown[idx] || 0, Math.max(0, (p.f - 0.45) / 0.55));
      k.g.setAttribute('opacity', fade.toFixed(2));
      k.g.setAttribute('transform', 'translate(' + (p.x - W / 2 * scale).toFixed(1) + ' ' + (p.y - H / 2 * scale).toFixed(1) + ') scale(' + scale.toFixed(3) + ')');
      var past = function (st) { return typeof p.stage === 'number' ? (p.stage > st || (p.stage === st && p.dwell > 0.45)) : true; };
      k.chip.setAttribute('opacity', past(1) ? 1 : 0);
      k.sent.setAttribute('opacity', past(2) ? 1 : 0);
      var show = past(3) || (p.stage === 3 && p.dwell > 0.2);
      var grow = p.stage === 3 ? Math.min(1, ((p.dwell || 1) - 0.2) / 0.6) : 1;
      k.conf.setAttribute('width', show ? (178 * c[3] * grow).toFixed(1) : 0);
      k.stamp.setAttribute('opacity', (p.stage === 'review' && p.dwell > 0.45) || p.stage === 'reviewed' || (c[6] && p.stage === 'bin') ? 1 : 0);
    }
    pills.forEach(function (p, i) { p.g.setAttribute('opacity', (shown[i] || 0).toFixed(2)); });
  }
  function describe() {
    return 'Comments move along the belt, take a theme, a sentiment and a confidence score, and land in speed only, execution only, both, or praise. A low-confidence one goes to a person first.';
  }
  M.mount(root, { duration: LOOP, freeze: parseFloat(root.getAttribute('data-freeze')) || 30, state: {}, draw: draw, describe: describe });
})();
</script>
